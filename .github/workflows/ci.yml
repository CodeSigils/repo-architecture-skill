name: validate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - ".githooks/**"
      - ".gitignore"
      - "AGENTS.md"
      - "CITATION.cff"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "evals/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "skills/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - ".githooks/**"
      - ".gitignore"
      - "AGENTS.md"
      - "CITATION.cff"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "evals/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "skills/**"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11.30"
  SKILLS_REF_SPEC: "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Sync locked maintainer environment
        run: uv sync --locked
      - name: Lint maintainer scripts
        run: uv run --locked ruff check scripts .github/scripts
      - name: Check maintainer script formatting
        run: uv run --locked ruff format --check scripts .github/scripts
      - name: Type-check maintainer scripts
        run: uv run --locked ty check scripts .github/scripts
      - name: Validate canonical payload and behavioral contract
        run: uv run --locked python scripts/validate.py
      - name: Validate Agent Skills format
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=3
          RETRY_BACKOFF_SECONDS=1
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            if uvx --from "${SKILLS_REF_SPEC}" skills-ref validate skills/repo-architecture-skill; then
              exit 0
            fi
            if [[ "${attempt}" == "${MAX_ATTEMPTS}" ]]; then
              echo "skills-ref validation failed after ${MAX_ATTEMPTS} attempts" >&2
              exit 1
            fi
            sleep $((RETRY_BACKOFF_SECONDS * (2 ** (attempt - 1))))
          done
          exit 1
      - name: Run validator self-tests
        run: uv run --locked python scripts/validate.py --self-test
      - name: Test behavioral evaluation fixture and runner
        run: uv run --locked python scripts/run-codex-regression.py --self-test
      - name: Test behavioral evaluation grader
        run: uv run --locked python scripts/grade-codex-regression.py --self-test
      - name: Check cross-agent portability
        run: uv run --locked python .github/scripts/check-portability.py
      - name: Run URL verifier self-tests
        run: uv run --locked python scripts/verify-urls.py --self-test
      - name: Run freshness checker self-tests
        run: uv run --locked python scripts/check-expiry.py --self-test
      - name: Check expired freshness markers
        run: uv run --locked python scripts/check-expiry.py

  monitor-external-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify external URL contracts
        run: python3 scripts/verify-urls.py
      - name: Check expired freshness markers
        if: ${{ !cancelled() }}
        run: python3 scripts/check-expiry.py
