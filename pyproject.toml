[project]
name = "repo-architecture-skill-maintenance"
version = "0.0.0"
description = "Maintainer tooling for the repo-architecture-skill repository"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "pyyaml==6.0.3",
  "ruff==0.16.9",
  "ty==0.0.84",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
